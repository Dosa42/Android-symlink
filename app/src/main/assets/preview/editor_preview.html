<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Standalone React & UI Preview Engine</title>
  <style>
    :root {
      --bg: #0f1322;
      --surface: #171b2f;
      --surface-variant: #212642;
      --primary: #4da3ff;
      --primary-container: #1b3558;
      --on-primary: #ffffff;
      --secondary: #90caf9;
      --accent: #00e5ff;
      --success: #00e676;
      --warning: #ffab00;
      --error: #ff5252;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2a3356;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Header Toolbar */
    .toolbar {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button, select {
      background: var(--surface-variant);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    button:active {
      transform: scale(0.96);
    }
    button.btn-primary {
      background: var(--primary);
      color: #0b1120;
      border-color: var(--primary);
      font-weight: 700;
    }
    button.btn-success {
      background: #059669;
      color: white;
      border-color: #10b981;
    }
    select {
      outline: none;
      padding-right: 20px;
    }
    /* Main Layout */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 768px) {
      .workspace {
        flex-direction: row;
      }
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .pane-header {
      background: var(--surface-variant);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* Editor */
    #editor-container {
      flex: 1;
      display: flex;
      background: #090d16;
      overflow: hidden;
      position: relative;
    }
    .line-numbers {
      width: 38px;
      padding: 12px 6px 12px 0;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #475569;
      user-select: none;
      background: #070a12;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    #code-input {
      flex: 1;
      background: transparent;
      color: #f8fafc;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }
    /* Preview Pane */
    #preview-container {
      flex: 1;
      background: var(--bg);
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    #render-target {
      width: 100%;
      height: 100%;
      min-height: 280px;
    }
    /* Status banner */
    .status-bar {
      padding: 4px 12px;
      background: #070a12;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-indicator {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 6px;
    }
    /* Rendered UI Sandbox Styling */
    .sandbox-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .sandbox-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sandbox-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .m3-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      min-height: 48px; /* Material 3 48dp compliance */
      border-radius: 24px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      margin: 4px 4px 4px 0;
    }
    .m3-btn-filled {
      background: var(--primary);
      color: #051937;
    }
    .m3-btn-tonal {
      background: var(--primary-container);
      color: var(--secondary);
    }
    .m3-btn-outlined {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }
    .m3-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      min-height: 32px;
      border-radius: 8px;
      font-size: 11px;
      background: var(--surface-variant);
      color: var(--text);
      border: 1px solid var(--border);
      margin: 3px;
      cursor: pointer;
    }
    .m3-chip.active {
      background: var(--primary-container);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      white-space: pre-wrap;
    }
    /* Tab bar for mobile */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .tab-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(77, 163, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <div class="toolbar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="badge">React & Preview Engine</span>
      <select id="template-selector" onchange="loadTemplate(this.value)">
        <option value="m3_interactive">Template: M3 Android UI Kit</option>
        <option value="room_inspector">Template: Room DB Flow Inspector</option>
        <option value="gemini_playground">Template: Gemini REST Playground</option>
        <option value="masterizer_radar">Template: Gate 1 Skill Radar</option>
        <option value="adaptive_canvas">Template: Adaptive Icon Safe Zone</option>
        <option value="omarchy_ssot">Template: Omarchy SSOT Discovery</option>
        <option value="dynamic_launcher">Template: Dynamic Launcher (phone-interface.md)</option>
      </select>
    </div>
    <div class="controls">
      <button class="btn-primary" onclick="executeCode()">▶ Run</button>
      <button onclick="auditInMasterizer()">⚡ Audit</button>
      <button onclick="sendToKotlinChat()">💬 Ask AI</button>
    </div>
  </div>

  <!-- Mobile View Toggle Tabs (visible on small screens) -->
  <div class="tab-bar" id="mobile-tabs" style="display:none;">
    <div class="tab-item active" onclick="switchMobileTab('split')">Split View</div>
    <div class="tab-item" onclick="switchMobileTab('editor')">Code Editor</div>
    <div class="tab-item" onclick="switchMobileTab('preview')">Live Preview</div>
  </div>

  <!-- Main Workspace -->
  <div class="workspace" id="workspace">
    <!-- Code Editor Pane -->
    <div class="pane" id="pane-editor">
      <div class="pane-header">
        <span>KOTLIN / REACT / DSL CODE</span>
        <span id="char-count" style="font-family:var(--font-mono);">0 chars</span>
      </div>
      <div id="editor-container">
        <div class="line-numbers" id="line-numbers">1</div>
        <textarea id="code-input" spellcheck="false" placeholder="Enter React or Kotlin DSL code here..."></textarea>
      </div>
    </div>

    <!-- Live Preview Pane -->
    <div class="pane" id="pane-preview">
      <div class="pane-header">
        <span>LIVE RUNTIME PREVIEW</span>
        <span id="fps-counter" style="color:var(--success);">● Standalone Executable</span>
      </div>
      <div id="preview-container">
        <div id="render-target"></div>
      </div>
    </div>
  </div>

  <!-- Footer Status -->
  <div class="status-bar">
    <div>
      <span class="status-indicator" id="status-dot"></span>
      <span id="status-text">Ready • Standalone Browser Framework Active</span>
    </div>
    <div style="font-size:10px; color:#64748b;">
      Gate 1 Foundation
    </div>
  </div>

  <script>
    // Templates preloaded for instant dynamic switching
    const TEMPLATES = {
      m3_interactive: `// Standalone Material 3 Interactive Preview
// Simulates Jetpack Compose M3 Component specs in real-time
function Component() {
  const [count, setCount] = React.useState(0);
  const [selectedTheme, setSelectedTheme] = React.useState('Expressive');
  const [elevation, setElevation] = React.useState(4);

  return (
    <div className="sandbox-card" style={{ boxShadow: \`0 \${elevation * 2}px \${elevation * 6}px rgba(0,0,0,0.35)\` }}>
      <div className="sandbox-title">
        <span>📱 Jetpack Compose M3 Simulator</span>
      </div>
      <div className="sandbox-subtitle">

      </div>

      <div style={{ margin: '14px 0', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>

        </button>
        <button className="m3-btn m3-btn-tonal" onClick={() => setCount(0)}>
          Reset State
        </button>
        <button className="m3-btn m3-btn-outlined" onClick={() => setElevation(elevation === 4 ? 12 : 4)}>
          Tonal Elevation: {elevation}dp

      </div>

      <div style={{ marginTop: '12px' }}>
        <div style={{ fontSize: '12px', color: '#94a3b8', marginBottom: '6px' }}>Theme Presets:</div>
        {['Expressive', 'Deep Navy', 'Cyber Cyan', 'Organic Warm'].map(theme => (
          <span 
            key={theme} 
            className={'m3-chip ' + (selectedTheme === theme ? 'active' : '')}
            onClick={() => setSelectedTheme(theme)}
          >
            {theme}
          </span>
        ))}
      </div>

      <div style={{ marginTop: '16px', padding: '12px', background: '#090d16', borderRadius: '8px', fontSize: '11px', fontFamily: 'monospace' }}>
        <div>StateFlow Value: {count}</div>
        <div>Active Theme: {selectedTheme}</div>
        <div>M3 Rule: 48dp Touch Target [PASSED]</div>
      </div>
    </div>
  );
}`,
      room_inspector: `// Room Database Flow Inspector Preview
function Component() {
  const [items, setItems] = React.useState([
    { id: 1, name: "gemini_api_config", timestamp: "10:45 AM" },
    { id: 2, name: "room_database_cache", timestamp: "10:47 AM" },
    { id: 3, name: "app_icon_layer_list", timestamp: "10:50 AM" }
  ]);
  const [newItem, setNewItem] = React.useState("");

  const addItem = () => {
    if (!newItem) return;
    setItems([...items, { id: Date.now(), name: newItem, timestamp: "Just now" }]);
    setNewItem("");
  };

  return (
    <div className="sandbox-card">
      <div className="sandbox-title">
        <span>💾 Room Database Flow & DAO Inspector</span>
      </div>
      <div className="sandbox-subtitle">
        Visualizing reactive Flow&lt;List&lt;Item&gt;&gt; from Room Database DAO queries.
      </div>

      <div style={{ display: 'flex', gap: '8px', margin: '14px 0' }}>
        <input 
          style={{ flex: 1, padding: '10px 14px', borderRadius: '8px', background: '#090d16', border: '1px solid #2a3356', color: '#fff', fontSize: '13px' }}
          placeholder="New entity name..."
          value={newItem}
          onChange={(e) => setNewItem(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && addItem()}
        />
        <button className="m3-btn m3-btn-filled" onClick={addItem}>Insert (DAO)</button>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
        {items.map(it => (
          <div key={it.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', background: '#1c223a', borderRadius: '8px', border: '1px solid #2a3356' }}>
            <div>
              <div style={{ fontWeight: 600, fontSize: '13px', color: '#4da3ff' }}>{it.name}</div>
              <div style={{ fontSize: '11px', color: '#64748b' }}>Primary Key: {it.id} • {it.timestamp}</div>
            </div>
            <button 
              style={{ background: 'transparent', border: 'none', color: '#ff5252', cursor: 'pointer', fontSize: '12px' }}
              onClick={() => setItems(items.filter(x => x.id !== it.id))}
            >
              Delete
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}`,
      gemini_playground: `// Gemini REST API & Model Playground
function Component() {
  const [model, setModel] = React.useState("gemini-3.5-flash");
  const [temperature, setTemperature] = React.useState(0.7);
  const [prompt, setPrompt] = React.useState("Generate an Android Clean Architecture Room DAO for offline skills.");
  const [loading, setLoading] = React.useState(false);
  const [response, setResponse] = React.useState("Gemini AI stands ready. Click 'Test Model Prompt' to invoke.");

  const sendPrompt = () => {
    setLoading(true);
    setResponse("Calling Gemini API via REST with 60s timeout...");
    setTimeout(() => {
      setLoading(false);
      setResponse(\`[Model: \${model}] Response received successfully:
@Dao
interface SkillDao {
    @Query("SELECT * FROM skills ORDER BY title ASC")
    fun getAllSkills(): Flow<List<SkillEntity>>

    @Insert(onConflict = OnConflictStrategy.REPLACE)
    suspend fun insertSkill(skill: SkillEntity)
}
// Verified: Uses KSP, suspend functions, and Flow return type.\`);
    }, 900);
  };

  return (
    <div className="sandbox-card">
      <div className="sandbox-title">
        <span>✨ Gemini REST API Playground</span>
      </div>
      <div className="sandbox-subtitle">
        Test prompts against recommended models: gemini-3.5-flash, gemini-3.1-pro-preview, or gemini-3.1-flash-lite.
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', margin: '10px 0' }}>
        <div>
          <label style={{ fontSize: '11px', color: '#94a3b8' }}>Target Model</label>
          <select 
            style={{ width: '100%', marginTop: '4px' }} 
            value={model} 
            onChange={(e) => setModel(e.target.value)}
          >
            <option value="gemini-3.5-flash">gemini-3.5-flash (Default General)</option>
            <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (Complex / Coding)</option>
            <option value="gemini-3.1-flash-lite-preview">gemini-3.1-flash-lite-preview (Fast Tasks)</option>
          </select>
        </div>
        <div>
          <label style={{ fontSize: '11px', color: '#94a3b8' }}>Temperature ({temperature})</label>
          <input 
            type="range" min="0" max="1" step="0.1" 
            value={temperature} 
            onChange={(e) => setTemperature(parseFloat(e.target.value))}
            style={{ width: '100%', marginTop: '8px' }}
          />
        </div>
      </div>

      <textarea 
        style={{ width: '100%', padding: '10px', borderRadius: '8px', background: '#090d16', border: '1px solid #2a3356', color: '#fff', fontSize: '12px', minHeight: '65px', margin: '8px 0' }}
        value={prompt}
        onChange={(e) => setPrompt(e.target.value)}
      />

      <button className="m3-btn m3-btn-filled" onClick={sendPrompt} disabled={loading}>
        {loading ? "Generating..." : "⚡ Test Model Prompt"}
      </button>

      <div style={{ marginTop: '12px', padding: '12px', background: '#090d16', borderRadius: '8px', fontSize: '12px', fontFamily: 'monospace', color: '#38bdf8', whiteSpace: 'pre-wrap' }}>
        {response}
      </div>
    </div>
  );
}`,
      masterizer_radar: `// Gate 1 Skill Masterizer Effectiveness Dashboard

      omarchy_ssot: `// Omarchy Single Source of Truth Discovery Engine
function Component() {
  const [cmd, setCmd] = React.useState("compgen -c | grep -E '^android-' | sort -u");
  const [output, setOutput] = React.useState(
    "android-gemini-route\\nandroid-icon-safezone\\nandroid-m3-audit\\nandroid-room-entity\\nandroid-secret-check\\nandroid-theme-set"
  );
  const [mode, setMode] = React.useState("Dynamic Discovery");

  const runDiscovery = (c) => {
    setCmd(c);
    if (c.includes("compgen")) {
      setMode("Command Discovery (compgen)");
      setOutput("android-gemini-route\\nandroid-icon-safezone\\nandroid-m3-audit\\nandroid-room-entity\\nandroid-secret-check\\nandroid-theme-set");

    }

    // Called by Kotlin Android Activity to inject code into editor
    window.injectCodeFromAndroid = function(newCode) {
      codeInput.value = newCode;
      updateLineNumbers();
      executeCode();
    };

    // Mobile tabs switcher
    function switchMobileTab(mode) {
      const editorPane = document.getElementById('pane-editor');
      const previewPane = document.getElementById('pane-preview');
      const tabs = document.querySelectorAll('.tab-item');
      
      tabs.forEach(t => t.classList.remove('active'));

      if (mode === 'split') {
        editorPane.style.display = 'flex';
        previewPane.style.display = 'flex';
        tabs[0].classList.add('active');
      } else if (mode === 'editor') {
        editorPane.style.display = 'flex';
        previewPane.style.display = 'none';
        tabs[1].classList.add('active');
      } else if (mode === 'preview') {
        editorPane.style.display = 'none';
        previewPane.style.display = 'flex';
        tabs[2].classList.add('active');
      }
    }

    // Auto-detect mobile screen to show tabs
    function checkViewport() {
      const tabs = document.getElementById('mobile-tabs');
      if (window.innerWidth < 768) {
        tabs.style.display = 'flex';
      } else {
        tabs.style.display = 'none';
        document.getElementById('pane-editor').style.display = 'flex';
        document.getElementById('pane-preview').style.display = 'flex';
      }
    }
    window.addEventListener('resize', checkViewport);

    // Initial setup
    checkViewport();
    loadTemplate('m3_interactive');
  </script>
</body>
</html>
